<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="Weather.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" id="cityInput" placeholder="Enter City Name" spellcheck="false">
            <button id="searchBtn"><img src="search.png" alt="Search"></button>
        </div>
        
        <button class="convert-temp" id="convertTemp">Convert to °F</button>
        <button class="convert-temp" id="currentLocationBtn">Use Current Location</button>
        
        <div class="weather">
            <img src="rain.png" alt="Weather Icon" class="weather-icon">
            <h1 class="temp">--°C</h1>
            <h2 class="city">City Name</h2>
            <p class="description">Weather Condition</p><br>
            <div class="details">
                <div class="colm">
                    <img src="humidity.png" alt="Humidity Icon">
                    <p class="humidity">Humidity:  --%</p>
                </div>
                <div class="colm">
                    <img src="wind.png" alt="Wind Icon">
                    <p class="wind">Wind Speed: -- km/h</p>
                </div>
            </div>
        </div>
        
        <p class="error">Invalid city name. Try again.</p>
    </div>

    <script src="Weather.js"></script>
</body>
</html>
